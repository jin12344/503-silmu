<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cortis ycc</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #F2EDE4;
      --cream-dark: #E8E0D0;
      --sand: #D4C9B5;
      --brown: #2C2118;
      --brown-mid: #5C4A35;
      --brown-light: #8B7355;
      --accent: #C17F3A;
      --accent-light: #E8A84E;
      --white: #FAF8F4;
      --error: #B85C38;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--cream);
      color: var(--brown);
      font-family: 'Noto Sans KR', 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--brown);
      color: var(--cream);
      padding: 0 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
    }

    .header-date {
      font-size: 0.78rem;
      color: var(--sand);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── HERO BAND ── */
    .hero-band {
      background: var(--accent);
      color: var(--white);
      padding: 0.6rem 3rem;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      display: flex;
      gap: 3rem;
    }

    /* ── MAIN GRID ── */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2.5rem 3rem 4rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 340px 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 1.5rem;
    }

    /* ── CARD BASE ── */
    .card {
      background: var(--white);
      border: 1px solid var(--sand);
      border-radius: 2px;
      padding: 1.8rem;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.12s; }
    .card:nth-child(3) { animation-delay: 0.19s; }
    .card:nth-child(4) { animation-delay: 0.26s; }

    .card-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brown-light);
      font-weight: 500;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--sand);
    }

    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.25rem;
      color: var(--brown);
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    /* ── WEATHER CARD ── */
    .weather-card {
      grid-row: 1 / 3;
      background: var(--brown);
      color: var(--cream);
      border-color: transparent;
    }

    .weather-card .card-label { color: var(--sand); }
    .weather-card .card-label::after { background: var(--brown-mid); }

    .weather-main {
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .weather-temp {
      font-family: 'DM Serif Display', serif;
      font-size: 5rem;
      line-height: 1;
      color: var(--cream);
    }

    .weather-icon-big {
      font-size: 3.5rem;
      line-height: 1;
    }

    .weather-desc {
      font-size: 1.1rem;
      color: var(--sand);
      margin-bottom: 0.3rem;
    }

    .weather-city {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--brown-light);
    }

    .weather-details {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      border-top: 1px solid var(--brown-mid);
      padding-top: 1.5rem;
    }

    .weather-detail-item label {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--brown-light);
      display: block;
      margin-bottom: 0.25rem;
    }

    .weather-detail-item span {
      font-size: 1.1rem;
      color: var(--cream);
      font-weight: 400;
    }

    .weather-forecast {
      margin-top: 1.5rem;
      border-top: 1px solid var(--brown-mid);
      padding-top: 1.5rem;
    }

    .forecast-label {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--brown-light);
      margin-bottom: 1rem;
    }

    .forecast-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .forecast-day { font-size: 0.8rem; color: var(--sand); }
    .forecast-icon { font-size: 1.1rem; }
    .forecast-temp { font-size: 0.9rem; color: var(--cream); }

    .weather-loading, .weather-error {
      font-size: 0.85rem;
      color: var(--sand);
      padding: 1rem 0;
    }

    /* ── NEWS CARD ── */
    .news-card {
      grid-column: 2 / 4;
    }

    .news-list { list-style: none; }

    .news-item {
      padding: 1rem 0;
      border-bottom: 1px solid var(--cream-dark);
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      cursor: pointer;
      transition: background 0.2s;
    }

    .news-item:last-child { border-bottom: none; }

    .news-item:hover .news-headline { color: var(--accent); }

    .news-num {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--sand);
      line-height: 1.2;
      min-width: 2rem;
    }

    .news-content { flex: 1; }

    .news-headline {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--brown);
      margin-bottom: 0.25rem;
      transition: color 0.2s;
    }

    .news-meta {
      font-size: 0.72rem;
      color: var(--brown-light);
      letter-spacing: 0.05em;
    }

    .news-source-tag {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: var(--cream-dark);
      border-radius: 2px;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--brown-light);
      margin-right: 0.4rem;
    }

    /* ── PUKYONG NEWS ── */
    .pukyong-card { }

    /* ── STATS CARD ── */
    .stats-card { }

    .stat-list { list-style: none; }

    .stat-item {
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--cream-dark);
    }

    .stat-item:last-child { border-bottom: none; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.4rem;
    }

    .stat-name {
      font-size: 0.82rem;
      color: var(--brown);
      font-weight: 400;
    }

    .stat-value {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      color: var(--accent);
    }

    .stat-bar-bg {
      height: 3px;
      background: var(--cream-dark);
      border-radius: 2px;
      overflow: hidden;
    }

    .stat-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 1s ease;
    }

    .stat-note {
      font-size: 0.7rem;
      color: var(--brown-light);
      margin-top: 0.3rem;
    }

    /* ── LOADING / ERROR STATES ── */
    .loading-text {
      color: var(--brown-light);
      font-size: 0.85rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .error-msg {
      color: var(--error);
      font-size: 0.82rem;
      padding: 0.5rem 0;
    }

    /* ── REFRESH BUTTON ── */
    .refresh-btn {
      background: none;
      border: 1px solid var(--sand);
      color: var(--brown-light);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
      float: right;
      margin-top: -0.2rem;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── FOOTER ── */
    footer {
      background: var(--brown);
      color: var(--sand);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 1100px) {
      .grid {
        grid-template-columns: 300px 1fr;
        grid-template-rows: auto auto auto;
      }
      .news-card { grid-column: 2 / 3; }
      .pukyong-card, .stats-card { grid-column: 1 / 3; }
    }

    @media (max-width: 700px) {
      header { padding: 0 1.2rem; }
      .hero-band { padding: 0.6rem 1.2rem; gap: 1.5rem; flex-wrap: wrap; }
      .container { padding: 1.2rem; }
      .grid { grid-template-columns: 1fr; }
      .weather-card, .news-card, .pukyong-card, .stats-card { grid-column: 1; grid-row: auto; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">cortis ycc</div>
  <div class="header-date" id="headerDate">로딩 중...</div>
</header>

<div class="hero-band">
  <span>🌊 부산</span>
  <span>🎓 부경대학교</span>
  <span>❤️ 사회복지</span>
  <span>☁️ 날씨</span>
</div>

<div class="container">
  <div class="grid">

    <!-- ── WEATHER ── -->
    <div class="card weather-card" id="weatherCard">
      <div class="card-label">날씨</div>
      <div id="weatherContent">
        <p class="weather-loading">날씨 정보를 불러오는 중...</p>
      </div>
    </div>

    <!-- ── BUSAN NEWS ── -->
    <div class="card news-card">
      <div class="card-label">
        부산 이슈
        <button class="refresh-btn" onclick="loadBusanNews()">↻ 새로고침</button>
      </div>
      <ul class="news-list" id="busanNewsList">
        <li><p class="loading-text">뉴스를 불러오는 중...</p></li>
      </ul>
    </div>

    <!-- ── PUKYONG NEWS ── -->
    <div class="card pukyong-card">
      <div class="card-label">
        부경대 소식
        <button class="refresh-btn" onclick="loadPukyongNews()">↻ 새로고침</button>
      </div>
      <ul class="news-list" id="pukyongNewsList">
        <li><p class="loading-text">뉴스를 불러오는 중...</p></li>
      </ul>
    </div>

    <!-- ── WELFARE STATS ── -->
    <div class="card stats-card">
      <div class="card-label">사회복지 통계</div>
      <ul class="stat-list" id="welfareStats"></ul>
    </div>

  </div>
</div>

<footer>
  <span>© 2025 나의 홈페이지 &nbsp;·&nbsp; GitHub Pages &nbsp;·&nbsp; 부산광역시</span>
</footer>

<script>
  /* ── DATE ── */
  function updateDate() {
    const now = new Date();
    const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    document.getElementById('headerDate').textContent =
      now.toLocaleDateString('ko-KR', opts);
  }
  updateDate();

  /* ── WEATHER (Open-Meteo, no API key needed) ── */
  async function loadWeather() {
    const card = document.getElementById('weatherContent');
    try {
      // 부산 좌표
      const lat = 35.1796, lon = 129.0756;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
        `&timezone=Asia%2FSeoul&forecast_days=5`;
      const res = await fetch(url);
      const data = await res.json();
      const c = data.current;
      const d = data.daily;

      const wIcon = weatherIcon(c.weather_code);
      const wDesc = weatherDesc(c.weather_code);

      const forecastRows = d.time.slice(0, 5).map((t, i) => {
        const label = i === 0 ? '오늘' : i === 1 ? '내일' : weekday(t);
        return `<div class="forecast-row">
          <span class="forecast-day">${label}</span>
          <span class="forecast-icon">${weatherIcon(d.weather_code[i])}</span>
          <span class="forecast-temp">${Math.round(d.temperature_2m_min[i])}° / ${Math.round(d.temperature_2m_max[i])}°</span>
        </div>`;
      }).join('');

      card.innerHTML = `
        <div class="weather-city">부산광역시</div>
        <div class="weather-main">
          <div class="weather-icon-big">${wIcon}</div>
          <div>
            <div class="weather-temp">${Math.round(c.temperature_2m)}<span style="font-size:2rem">°</span></div>
            <div class="weather-desc">${wDesc}</div>
          </div>
        </div>
        <div class="weather-details">
          <div class="weather-detail-item">
            <label>습도</label>
            <span>${c.relative_humidity_2m}%</span>
          </div>
          <div class="weather-detail-item">
            <label>풍속</label>
            <span>${c.wind_speed_10m} km/h</span>
          </div>
        </div>
        <div class="weather-forecast">
          <div class="forecast-label">5일 예보</div>
          ${forecastRows}
        </div>`;
    } catch(e) {
      card.innerHTML = `<p class="weather-error">날씨 정보를 불러올 수 없습니다.<br><small>${e.message}</small></p>`;
    }
  }

  function weatherIcon(code) {
    if (code === 0) return '☀️';
    if (code <= 2)  return '🌤️';
    if (code <= 3)  return '☁️';
    if (code <= 49) return '🌫️';
    if (code <= 57) return '🌧️';
    if (code <= 67) return '🌧️';
    if (code <= 77) return '❄️';
    if (code <= 82) return '🌦️';
    if (code <= 86) return '🌨️';
    if (code <= 99) return '⛈️';
    return '🌡️';
  }

  function weatherDesc(code) {
    if (code === 0) return '맑음';
    if (code <= 2)  return '대체로 맑음';
    if (code <= 3)  return '흐림';
    if (code <= 49) return '안개';
    if (code <= 57) return '이슬비';
    if (code <= 67) return '비';
    if (code <= 77) return '눈';
    if (code <= 82) return '소나기';
    if (code <= 86) return '눈 소나기';
    if (code <= 99) return '천둥번개';
    return '알 수 없음';
  }

  function weekday(dateStr) {
    const days = ['일','월','화','수','목','금','토'];
    return days[new Date(dateStr).getDay()] + '요일';
  }

  /* ── NEWS via RSS2JSON (free, no key needed) ── */
  async function fetchRSS(rssUrl) {
    const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&count=6`;
    const res = await fetch(api);
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message || 'RSS 오류');
    return data.items;
  }

  function renderNews(listId, items, sourceTag) {
    const ul = document.getElementById(listId);
    if (!items || items.length === 0) {
      ul.innerHTML = '<li><p class="error-msg">뉴스를 찾을 수 없습니다.</p></li>';
      return;
    }
    ul.innerHTML = items.map((item, i) => {
      const date = item.pubDate ? new Date(item.pubDate).toLocaleDateString('ko-KR') : '';
      const title = item.title || '제목 없음';
      const link  = item.link  || '#';
      return `<li class="news-item" onclick="window.open('${link}','_blank')">
        <div class="news-num">${String(i+1).padStart(2,'0')}</div>
        <div class="news-content">
          <div class="news-headline">${title}</div>
          <div class="news-meta">
            <span class="news-source-tag">${sourceTag}</span>${date}
          </div>
        </div>
      </li>`;
    }).join('');
  }

  async function loadBusanNews() {
    const ul = document.getElementById('busanNewsList');
    ul.innerHTML = '<li><p class="loading-text">불러오는 중...</p></li>';
    try {
      // 연합뉴스 부산 RSS
      const items = await fetchRSS('https://www.yna.co.kr/rss/local.xml');
      const busan = items.filter(i =>
        (i.title + (i.description||'')).includes('부산')
      ).slice(0, 6);
      renderNews('busanNewsList', busan.length ? busan : items.slice(0,6), '부산');
    } catch(e) {
      // fallback: 부산일보
      try {
        const items2 = await fetchRSS('https://www.busan.com/rss/allArticle.xml');
        renderNews('busanNewsList', items2, '부산일보');
      } catch(e2) {
        ul.innerHTML = `<li><p class="error-msg">뉴스를 불러올 수 없습니다. (${e2.message})</p></li>`;
      }
    }
  }

  async function loadPukyongNews() {
    const ul = document.getElementById('pukyongNewsList');
    ul.innerHTML = '<li><p class="loading-text">불러오는 중...</p></li>';
    try {
      // 네이버 뉴스 부경대 검색 RSS
      const items = await fetchRSS('https://www.yna.co.kr/rss/all.xml');
      const pknu = items.filter(i =>
        (i.title + (i.description||'')).match(/부경대|PKNU|부경/)
      ).slice(0,6);
      if (pknu.length > 0) {
        renderNews('pukyongNewsList', pknu, '부경대');
      } else {
        // 대학 소식 일반
        const items2 = await fetchRSS('https://www.yna.co.kr/rss/culture.xml');
        const edu = items2.filter(i =>
          (i.title+(i.description||'')).includes('대학')
        ).slice(0,6);
        renderNews('pukyongNewsList', edu.length ? edu : items2.slice(0,6), '교육');
      }
    } catch(e) {
      ul.innerHTML = `<li><p class="error-msg">뉴스를 불러올 수 없습니다.</p></li>`;
    }
  }

  /* ── WELFARE STATS (한국 사회복지 주요 통계, 출처: 보건복지부) ── */
  function loadWelfareStats() {
    const stats = [
      { name: '국민기초생활수급자 수', value: '236만 명', note: '2023년 기준 (보건복지부)', pct: 45 },
      { name: '노인 인구 비율 (한국)', value: '18.4%', note: '65세 이상 (2023)', pct: 18 },
      { name: '장애인 등록 현황', value: '264만 명', note: '2023년 기준', pct: 51 },
      { name: '보육시설 이용 아동', value: '128만 명', note: '전국 어린이집 기준 (2023)', pct: 24 },
      { name: '아동 빈곤율', value: '7.2%', note: '가처분소득 기준 OECD 보고 (2022)', pct: 7 },
      { name: '사회복지 예산 (국가)', value: '214조 원', note: '2024년 보건복지부 예산', pct: 75 },
    ];

    const ul = document.getElementById('welfareStats');
    ul.innerHTML = stats.map(s => `
      <li class="stat-item">
        <div class="stat-row">
          <span class="stat-name">${s.name}</span>
          <span class="stat-value">${s.value}</span>
        </div>
        <div class="stat-bar-bg">
          <div class="stat-bar" style="width:0%" data-pct="${s.pct}"></div>
        </div>
        <div class="stat-note">${s.note}</div>
      </li>`).join('');

    // animate bars
    setTimeout(() => {
      document.querySelectorAll('.stat-bar').forEach(bar => {
        bar.style.width = bar.dataset.pct + '%';
      });
    }, 300);
  }

  /* ── INIT ── */
  loadWeather();
  loadBusanNews();
  loadPukyongNews();
  loadWelfareStats();

  // 10분마다 날씨 자동 갱신
  setInterval(loadWeather, 600000);
</script>
</body>
</html>
